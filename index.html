<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The court implements its own pinch-zoom, so browser page zoom is locked
         to stop the two gestures fighting. viewport-fit=cover enables the
         env(safe-area-inset-*) padding used by the mobile bars. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Draw tennis tactics — player positions, ball paths, movement and shot angles. Works offline."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diagram" />
    <title>Tennis Tactics Diagram</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
